<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The duetspace petal mark (style guide 147:419). Each petal is a square
       whose radius equals half its side, i.e. a circle with one square corner:
       teal points top-right, blue points bottom-left. Drawn as a circle plus a
       quadrant square so the geometry holds at any size. Blue sits above teal. -->
  <g fill="#00F5D4">
    <circle cx="12" cy="12" r="10.5"/>
    <rect x="12" y="1.5" width="10.5" height="10.5"/>
  </g>
  <g fill="#3B82F6">
    <circle cx="20" cy="20" r="10.5"/>
    <rect x="9.5" y="20" width="10.5" height="10.5"/>
  </g>
</svg>
